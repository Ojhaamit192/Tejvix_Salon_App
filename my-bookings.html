<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookings — Tejvix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/logo-icon.png">
<style>
  :root{
    --bg: #0D0A08; --bg-panel: #1A130E; --bg-panel-2: #241A12; --line: #3D2A1A;
    --gold: #FF6A00; --gold-soft: #FFB020; --text: #F5F0EA; --text-dim: #C9B29A;
    --success: #5EAE7C; --danger: #E0574A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter', sans-serif; line-height:1.5; }
  h1,h2{font-family:'Fraunces', serif; font-weight:500;}
  a{color:var(--gold-soft);}
  .wrap{max-width:560px; margin:0 auto; padding:40px 20px 60px;}
  .logo{display:flex; align-items:center; gap:8px; font-family:'Fraunces',serif; font-size:1.2rem; font-weight:600; margin-bottom:24px;}
  .logo img{height:32px; filter: drop-shadow(0 0 8px rgba(255,106,0,0.5));}
  .logo span{color:var(--gold-soft);}
  h1{font-size:1.6rem; margin-bottom:6px;}
  p.lede{color:var(--text-dim); margin-bottom:24px; font-size:0.95rem;}
  .lookup-row{display:flex; gap:10px; margin-bottom:28px;}
  input{ flex:1; background:var(--bg-panel); border:1px solid var(--line); border-radius:8px; padding:13px 14px; color:var(--text); font-size:0.95rem; }
  input:focus{border-color:var(--gold-soft);}
  button{ background:var(--gold); color:#1a0d00; padding:13px 20px; border-radius:8px; font-weight:600; border:none; cursor:pointer; }
  button:hover{background:var(--gold-soft);}
  .booking-card{ background:var(--bg-panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; }
  .booking-card .row{display:flex; justify-content:space-between; font-size:0.9rem; padding:4px 0;}
  .booking-card .salon-name{font-weight:600; font-size:1rem; margin-bottom:8px;}
  .badge{ font-size:0.75rem; padding:3px 8px; border-radius:20px; }
  .badge.upcoming{background:rgba(94,174,122,0.15); color:var(--success);}
  .badge.past{background:rgba(201,178,154,0.15); color:var(--text-dim);}
  .section-label{color:var(--text-dim); font-size:0.85rem; text-transform:uppercase; letter-spacing:0.05em; margin:24px 0 12px;}
  .state-box{text-align:center; padding:36px 20px; color:var(--text-dim);}
  .state-box .icon{font-size:2rem; margin-bottom:10px;}
</style>
</head>
<body>
<div class="wrap">
  <a href="index.html" class="logo"><img src="assets/logo-icon.png" alt="Tejvix">Tejvix<span>.</span></a>
  <h1>My Bookings</h1>
  <p class="lede">Enter the mobile number you booked with to see your bookings across any salon.</p>

  <div class="lookup-row">
    <input type="tel" id="phoneInput" placeholder="+91 98xxxxxxx">
    <button id="lookupBtn">Look Up</button>
  </div>

  <div id="results"></div>
</div>

<script>
  const API_BASE = "/api";
  const phoneInput = document.getElementById('phoneInput');
  const results = document.getElementById('results');

  function fmtDate(iso){
    return new Date(iso).toLocaleString('en-IN', { day:'numeric', month:'short', hour:'numeric', minute:'2-digit', hour12:true });
  }

  function renderBookingCard(b){
    const isUpcoming = ['waiting','serving','scheduled'].includes(b.status);
    const when = b.booking_type === 'appointment' ? fmtDate(b.scheduled_at) : fmtDate(b.created_at);
    const statusLabel = {
      waiting: 'Waiting in queue', serving: 'Being served now', done: 'Completed',
      no_show: 'Marked as no-show', scheduled: 'Upcoming appointment',
    }[b.status] || b.status;
    return `
      <div class="booking-card">
        <div class="salon-name">${b.salon_name}</div>
        <div class="row"><span>Service</span><span>${b.service_name || '—'}${b.service_price ? ' · ₹' + b.service_price : ''}</span></div>
        ${b.token ? `<div class="row"><span>Token</span><span>${b.token}</span></div>` : ''}
        <div class="row"><span>When</span><span>${when}</span></div>
        <div class="row"><span>Status</span><span class="badge ${isUpcoming?'upcoming':'past'}">${statusLabel}</span></div>
      </div>`;
  }

  async function lookup(){
    const phone = phoneInput.value.trim();
    if (!phone){
      results.innerHTML = `<div class="state-box"><div class="icon">📱</div><p>Please enter your mobile number.</p></div>`;
      return;
    }
    results.innerHTML = `<div class="state-box"><div class="icon">⏳</div><p>Looking up your bookings...</p></div>`;
    try{
      const res = await fetch(`${API_BASE}/my-bookings?phone=${encodeURIComponent(phone)}`);
      const data = await res.json();
      if(!res.ok) throw new Error(data.error);

      if (!data.bookings.length){
        results.innerHTML = `<div class="state-box"><div class="icon">📭</div><h3>No bookings found</h3><p>No bookings under this number yet.</p></div>`;
        return;
      }

      const upcoming = data.bookings.filter(b => ['waiting','serving','scheduled'].includes(b.status));
      const past = data.bookings.filter(b => !['waiting','serving','scheduled'].includes(b.status));

      let html = '';
      if (upcoming.length){
        html += `<div class="section-label">Upcoming</div>` + upcoming.map(renderBookingCard).join('');
      }
      if (past.length){
        html += `<div class="section-label">Past</div>` + past.map(renderBookingCard).join('');
      }
      results.innerHTML = html;
    }catch(err){
      results.innerHTML = `<div class="state-box"><div class="icon">⚠️</div><h3>Something went wrong</h3><p>Couldn't load your bookings — please try again.</p></div>`;
      console.error(err);
    }
  }

  document.getElementById('lookupBtn').addEventListener('click', lookup);
  phoneInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') lookup(); });
</script>
</body>
</html>
